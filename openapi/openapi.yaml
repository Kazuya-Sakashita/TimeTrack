openapi: 3.0.3
info:
  title: TimeTrack API
  version: 0.1.0
  description: |
    TimeTrack（勤怠管理システム）の API 仕様。
    この OpenAPI を唯一の仕様書とし、実装より先に契約を確定する（API 駆動開発）。

    規約:
    - リソース ID は内部連番ではなく public_id を使う（例: usr_xxx）。
    - 認証は JWT (Bearer)。認可は Pundit（バックエンド側）。
    - エラーは共通の Error スキーマで返す。

servers:
  - url: http://localhost:3000
    description: ローカル開発（docker compose）

tags:
  - name: System
    description: ヘルスチェック等
  - name: Auth
    description: 認証（ログイン・ログアウト）
  - name: Me
    description: ログイン中ユーザー
  - name: Attendance
    description: 勤怠打刻

paths:
  /health:
    get:
      tags: [System]
      summary: ヘルスチェック
      description: アプリと DB の疎通を確認する（Walking Skeleton）。
      security: []
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
                db: ok

  /auth/login:
    post:
      tags: [Auth]
      summary: ログイン
      description: email / password で認証し、JWT を発行する。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: 認証失敗（email/password 不一致）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: バリデーションエラー（必須項目欠落など）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    delete:
      tags: [Auth]
      summary: ログアウト
      description: |
        ステートレス JWT のため、クライアントは保持トークンを破棄する。
        サーバは 204 を返す（将来、jti denylist による即時失効を追加可能）。
      responses:
        "204":
          description: ログアウト完了
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attendances/clock-in:
    post:
      tags: [Attendance]
      summary: 出勤打刻
      description: ログイン中ユーザーの本日の出勤を記録する（1日1回）。
      responses:
        "201":
          description: 出勤打刻成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 既に本日出勤済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attendances/clock-out:
    post:
      tags: [Attendance]
      summary: 退勤打刻
      description: 本日の出勤中レコードを退勤済みにし、勤務時間を確定する。
      responses:
        "200":
          description: 退勤打刻成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 未出勤、または既に退勤済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me:
    get:
      tags: [Me]
      summary: ログイン中ユーザーの取得
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          example: ok
        db:
          type: string
          enum: [ok, error]
          example: ok

    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          description: 外部公開 ID（内部連番ではない）
          example: usr_a1B2c3D4e5F6
        email:
          type: string
          format: email
          example: admin@example.com
        name:
          type: string
          example: 管理 太郎
        role:
          type: string
          enum: [employee, manager, admin]
          example: admin

    Attendance:
      type: object
      required: [id, workDate, status]
      properties:
        id:
          type: string
          description: 外部公開 ID
          example: att_a1B2c3D4e5F6
        workDate:
          type: string
          format: date
          example: "2026-06-11"
        clockInAt:
          type: string
          format: date-time
          nullable: true
        clockOutAt:
          type: string
          format: date-time
          nullable: true
        workMinutes:
          type: integer
          nullable: true
          description: 勤務時間（分）。退勤前は null
          example: 480
        status:
          type: string
          enum: [working, finished]
          example: working

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          format: password
          example: password

    AuthToken:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT。以降のリクエストは Authorization: Bearer <token> で送る
        user:
          $ref: "#/components/schemas/User"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 機械可読なエラーコード
              example: unauthorized
            message:
              type: string
              description: 人間可読なエラーメッセージ
              example: 認証が必要です

# デフォルトで全エンドポイントに JWT を要求し、公開エンドポイントは
# 各 path で security: [] により上書きする。
security:
  - bearerAuth: []
