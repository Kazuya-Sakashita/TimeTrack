openapi: 3.0.3
info:
  title: TimeTrack API
  version: 0.1.0
  description: |
    TimeTrack（勤怠管理システム）の API 仕様。
    この OpenAPI を唯一の仕様書とし、実装より先に契約を確定する（API 駆動開発）。

    規約:
    - リソース ID は内部連番ではなく public_id を使う（例: usr_xxx）。
    - 認証は JWT (Bearer)。認可は Pundit（バックエンド側）。
    - エラーは共通の Error スキーマで返す。

servers:
  - url: http://localhost:3000
    description: ローカル開発（docker compose）

tags:
  - name: System
    description: ヘルスチェック等
  - name: Auth
    description: 認証（ログイン・ログアウト）
  - name: Me
    description: ログイン中ユーザー
  - name: Attendance
    description: 勤怠打刻
  - name: ChangeRequest
    description: 勤怠修正申請

paths:
  /health:
    get:
      tags: [System]
      summary: ヘルスチェック
      description: アプリと DB の疎通を確認する（Walking Skeleton）。
      security: []
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
                db: ok

  /auth/login:
    post:
      tags: [Auth]
      summary: ログイン
      description: email / password で認証し、JWT を発行する。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: 認証失敗（email/password 不一致）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: バリデーションエラー（必須項目欠落など）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    delete:
      tags: [Auth]
      summary: ログアウト
      description: |
        ステートレス JWT のため、クライアントは保持トークンを破棄する。
        サーバは 204 を返す（将来、jti denylist による即時失効を追加可能）。
      responses:
        "204":
          description: ログアウト完了
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attendances:
    get:
      tags: [Attendance]
      summary: 勤怠一覧（自分）
      description: ログイン中ユーザー自身の勤怠を新しい日付順で返す（ページング）。
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceList"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags: [Attendance]
      summary: 出勤打刻（勤怠の作成）
      description: ログイン中ユーザーの本日の勤怠を作成し、出勤時刻を記録する（1日1回）。
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 既に本日出勤済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attendances/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 勤怠の public_id
    get:
      tags: [Attendance]
      summary: 勤怠詳細（自分）
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [Attendance]
      summary: 勤怠の更新（退勤）
      description: 勤怠の状態を更新する。退勤は status を finished にする（状態変更=update）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 不正な状態遷移（既に退勤済み等）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attendances/{attendanceId}/breaks:
    parameters:
      - name: attendanceId
        in: path
        required: true
        schema:
          type: string
        description: 勤怠の public_id
    post:
      tags: [Attendance]
      summary: 休憩開始（休憩の作成）
      description: 勤怠に休憩を作成する。親勤怠の最新状態を返す。
      responses:
        "201":
          description: 休憩開始成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 退勤済 / 既に休憩中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attendances/{attendanceId}/breaks/{id}:
    parameters:
      - name: attendanceId
        in: path
        required: true
        schema:
          type: string
        description: 勤怠の public_id
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 休憩の public_id
    patch:
      tags: [Attendance]
      summary: 休憩終了（休憩の更新）
      description: 休憩を終了する（ended_at をセット）。親勤怠の最新状態を返す。
      responses:
        "200":
          description: 休憩終了成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 休憩中でない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attendance_change_requests:
    get:
      tags: [ChangeRequest]
      summary: 修正申請の一覧
      description: 従業員は自分の申請、manager/admin は全件を返す（policy_scope）。
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceChangeRequest"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [ChangeRequest]
      summary: 修正申請の作成
      description: 自分の勤怠に対する打刻時刻の修正を申請する（status=pending で作成）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceChangeRequestCreateRequest"
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceChangeRequest"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 対象勤怠が見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attendance_change_requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 修正申請の public_id
    get:
      tags: [ChangeRequest]
      summary: 修正申請の詳細
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceChangeRequest"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me:
    get:
      tags: [Me]
      summary: ログイン中ユーザーの取得
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: 未認証
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          example: ok
        db:
          type: string
          enum: [ok, error]
          example: ok

    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          description: 外部公開 ID（内部連番ではない）
          example: usr_a1B2c3D4e5F6
        email:
          type: string
          format: email
          example: admin@example.com
        name:
          type: string
          example: 管理 太郎
        role:
          type: string
          enum: [employee, manager, admin]
          example: admin

    Attendance:
      type: object
      required: [id, workDate, status]
      properties:
        id:
          type: string
          description: 外部公開 ID
          example: att_a1B2c3D4e5F6
        workDate:
          type: string
          format: date
          example: "2026-06-11"
        clockInAt:
          type: string
          format: date-time
          nullable: true
        clockOutAt:
          type: string
          format: date-time
          nullable: true
        workMinutes:
          type: integer
          nullable: true
          description: 勤務時間（分、休憩控除後）。退勤前は null
          example: 420
        breakMinutes:
          type: integer
          description: 休憩時間の合計（分）
          example: 60
        openBreakId:
          type: string
          nullable: true
          description: 進行中（未終了）の休憩の public_id。休憩中でなければ null
          example: brk_a1B2c3D4e5F6
        status:
          type: string
          enum: [working, on_break, finished]
          example: working

    AttendanceUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [finished]
          description: 遷移先の状態。退勤は finished
          example: finished

    Pagination:
      type: object
      required: [page, perPage, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 20
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3

    AttendanceList:
      type: object
      required: [attendances, pagination]
      properties:
        attendances:
          type: array
          items:
            $ref: "#/components/schemas/Attendance"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AttendanceChangeRequest:
      type: object
      required: [id, attendanceId, reason, status]
      properties:
        id:
          type: string
          example: acr_a1B2c3D4e5F6
        attendanceId:
          type: string
          description: 対象勤怠の public_id
          example: att_a1B2c3D4e5F6
        applicantName:
          type: string
          example: 社員 次郎
        proposedClockInAt:
          type: string
          format: date-time
          nullable: true
        proposedClockOutAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          example: 打刻し忘れたため
        status:
          type: string
          enum: [pending, approved, rejected]
          example: pending
        reviewComment:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    AttendanceChangeRequestCreateRequest:
      type: object
      required: [attendanceId, reason]
      properties:
        attendanceId:
          type: string
          description: 対象勤怠の public_id
        proposedClockInAt:
          type: string
          format: date-time
          nullable: true
        proposedClockOutAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          format: password
          example: password

    AuthToken:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT。以降のリクエストは Authorization: Bearer <token> で送る
        user:
          $ref: "#/components/schemas/User"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 機械可読なエラーコード
              example: unauthorized
            message:
              type: string
              description: 人間可読なエラーメッセージ
              example: 認証が必要です

# デフォルトで全エンドポイントに JWT を要求し、公開エンドポイントは
# 各 path で security: [] により上書きする。
security:
  - bearerAuth: []
